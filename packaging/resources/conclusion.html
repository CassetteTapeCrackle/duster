<h2>Installed</h2>
<p>Rescan plug-ins in your host if Duster does not show up. You will find it under
the manufacturer <b>LVST</b>.</p>
<p>To uninstall, delete <code>Duster.component</code> and <code>Duster.vst3</code>
from <code>/Library/Audio/Plug-Ins</code>.</p>
